<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1590" viewBox="0 0 900 1590" role="img" aria-labelledby="title desc">
<title id="title">Ragged Pooling for PyTorch</title>
<desc id="desc">A conceptual example with groups of two items, three items and no items. Softmax turns each nonempty group&#x27;s scores into weights. A weighted sum produces one vector per group. Empty groups produce a zero vector. Training sends gradients back to values and scores. CPU implementation. This illustration does not report a benchmark or model quality result.</desc>
