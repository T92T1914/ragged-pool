name: Project explainer

on:
  pull_request:
    branches: [main]
    paths: ['site/**', 'tools/build_site.py', 'tools/test_site.py', 'docs/ragged-pool-*', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['site/**', 'tools/build_site.py', 'tools/test_site.py', 'docs/ragged-pool-*', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: explainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.8'
      - name: Validate the static sources without importing PyTorch
        run: python tools/test_site.py
      - name: Build only the reviewed static payload
        run: python tools/build_site.py
      - name: Check the actual generated bytes
        run: python tools/build_site.py --check-built
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site
  deploy-site:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Deploy the checked static explanation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

