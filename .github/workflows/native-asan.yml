name: Native CPU AddressSanitizer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumented-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MAX_JOBS: '2'
      PYTHONNOUSERSITE: '1'
      PYTHONPATH: ''
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      CC: gcc-13
      CXX: g++-13
      RAGGED_POOL_ASAN: '1'
      CAMPAIGN_SECONDS: ${{ github.event_name == 'pull_request' && '600' || '5' }}
      SECOND_ORDER_SECONDS: ${{ github.event_name == 'pull_request' && '30' || '5' }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select CPython 3.11.8 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.8'
          architecture: x64
      - name: Resolve the existing GNU C++ 13 ASan and C++ runtimes
        run: |
          set -euo pipefail
          "$CXX" --version
          python --version
          runtime="$("$CXX" -print-file-name=libasan.so)"
          stdlib="$("$CXX" -print-file-name=libstdc++.so.6)"
          test -f "$runtime"
          test -f "$stdlib"
          sha256sum "$runtime" "$stdlib"
          echo "ASAN_RUNTIME=$runtime" >> "$GITHUB_ENV"
          echo "CXX_STDLIB=$stdlib" >> "$GITHUB_ENV"
          echo "ASAN_OPTIONS=detect_leaks=0:halt_on_error=1" >> "$GITHUB_ENV"
          echo "RAGGED_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Prepare one isolated instrumented environment and build
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/ragged-asan"
          python="$RUNNER_TEMP/ragged-asan/bin/python"
          "$python" -m pip --isolated install 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          "$python" -m pip --isolated install -r requirements-lock.txt
          "$python" -m pip --isolated wheel . --no-build-isolation --no-deps --wheel-dir "$RUNNER_TEMP/asan-wheel"
          "$python" -m pip --isolated install --no-deps "$RUNNER_TEMP"/asan-wheel/*.whl
          "$python" -m pip check
          mkdir "$RUNNER_TEMP/ragged-asan-consumer"
          cp -r tests "$RUNNER_TEMP/ragged-asan-consumer/tests"
          cp -r examples "$RUNNER_TEMP/ragged-asan-consumer/examples"
          cp scripts/native_campaign.py scripts/check_asan_control.py examples/train_sets.py "$RUNNER_TEMP/ragged-asan-consumer/"
          mkdir "$RUNNER_TEMP/ragged-asan-consumer/scripts"
          cp scripts/check_installed.py scripts/check_sdist.py scripts/check_stochastic_receipt.py scripts/check_activation_receipt.py "$RUNNER_TEMP/ragged-asan-consumer/scripts/"
          # Read-only source fixtures serve mocked build/loader tests only.
          # Numerical tests continue importing the ordinary installed package.
          mkdir -p "$RUNNER_TEMP/ragged-asan-consumer/src/ragged_pool"
          cp setup.py "$RUNNER_TEMP/ragged-asan-consumer/"
          cp src/ragged_pool/_build.py src/ragged_pool/__init__.py "$RUNNER_TEMP/ragged-asan-consumer/src/ragged_pool/"
          chmod a-w "$RUNNER_TEMP/ragged-asan-consumer/setup.py" "$RUNNER_TEMP/ragged-asan-consumer/src/ragged_pool/_build.py" "$RUNNER_TEMP/ragged-asan-consumer/src/ragged_pool/__init__.py"
          mkdir "$RUNNER_TEMP/asan-evidence"
      - name: Qualify the tool with an injected negative control
        working-directory: ${{ runner.temp }}/ragged-asan-consumer
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ragged-asan/bin/python" -I check_asan_control.py --directory "$RUNNER_TEMP/asan-evidence/control"
      - name: Probe the installed production extension under ASan
        working-directory: ${{ runner.temp }}/ragged-asan-consumer
        run: |
          set -uo pipefail
          python="$RUNNER_TEMP/ragged-asan/bin/python"
          if LD_PRELOAD="$ASAN_RUNTIME:$CXX_STDLIB" "$python" -I -u -X faulthandler -c 'import torch; print("torch import passed", torch.__version__); import ragged_pool; print("ragged_pool import passed"); import pytest; print("pytest import passed")' > "$RUNNER_TEMP/asan-evidence/import.stdout" 2> "$RUNNER_TEMP/asan-evidence/import.stderr"; then
            cat "$RUNNER_TEMP/asan-evidence/import.stdout"
            cat "$RUNNER_TEMP/asan-evidence/import.stderr"
          else
            status=$?
            cat "$RUNNER_TEMP/asan-evidence/import.stdout"
            cat "$RUNNER_TEMP/asan-evidence/import.stderr"
            ASAN_OPTIONS="$ASAN_OPTIONS:verbosity=1:log_path=$RUNNER_TEMP/asan-evidence/import-verbose" LD_PRELOAD="$ASAN_RUNTIME:$CXX_STDLIB" "$python" -I -u -X faulthandler -c 'import torch; print("torch import passed", torch.__version__); import ragged_pool; print("ragged_pool import passed"); import pytest; print("pytest import passed")' > "$RUNNER_TEMP/asan-evidence/import-verbose.stdout" 2> "$RUNNER_TEMP/asan-evidence/import-verbose.stderr" || true
            tail -n 80 "$RUNNER_TEMP/asan-evidence/import-verbose.stderr"
            for report in "$RUNNER_TEMP"/asan-evidence/import-verbose.[0-9]*; do
              if test -f "$report"; then tail -n 80 "$report"; fi
            done
            exit "$status"
          fi
      - name: Instrumented production tests and bounded generated campaign
        working-directory: ${{ runner.temp }}/ragged-asan-consumer
        run: |
          set -euo pipefail
          export LD_PRELOAD="$ASAN_RUNTIME:$CXX_STDLIB"
          python="$RUNNER_TEMP/ragged-asan/bin/python"
          "$python" -I -u -X faulthandler -m pytest -vv -s --maxfail=1 --import-mode=importlib tests
          "$python" -I -u -X faulthandler native_campaign.py --cases tests/generated_cases.py --seconds "$CAMPAIGN_SECONDS" --seed 20261020 --output "$RUNNER_TEMP/asan-evidence/campaign.json"
          "$python" -I -u -X faulthandler native_campaign.py --cases tests/generated_cases.py --seconds 5 --seed 20261020 --output "$RUNNER_TEMP/asan-evidence/replay.json"
          "$python" -I -u -X faulthandler train_sets.py --dtype float32
          "$python" -I -u -X faulthandler train_sets.py --dtype float64
          "$python" -I -u -X faulthandler examples/train_padded.py --dtype float32 --output "$RUNNER_TEMP/asan-evidence/padded-float32.json"
          "$python" -I -u -X faulthandler examples/train_padded.py --dtype float64 --output "$RUNNER_TEMP/asan-evidence/padded-float64.json"
          "$python" -I -u -X faulthandler examples/train_padded.py --compiled --dtype float32 --output "$RUNNER_TEMP/asan-evidence/padded-compiled-float32.json"
          "$python" -I -u -X faulthandler examples/train_padded.py --compiled --dtype float64 --output "$RUNNER_TEMP/asan-evidence/padded-compiled-float64.json"
          "$python" -I -u -X faulthandler examples/train_gradient_penalty.py --dtype float32 --output "$RUNNER_TEMP/asan-evidence/gradient-penalty-float32.json"
          "$python" -I -u -X faulthandler examples/train_gradient_penalty.py --dtype float64 --output "$RUNNER_TEMP/asan-evidence/gradient-penalty-float64.json"
          for dtype in float32 float64; do
            receipt="$RUNNER_TEMP/asan-evidence/padded-gradient-penalty-$dtype.json"
            "$python" -I -u -X faulthandler examples/train_padded_gradient_penalty.py --dtype "$dtype" --output "$receipt"
            "$python" -I - "$receipt" "$dtype" <<'PY'
          import json
          from pathlib import Path
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["status"] == "passed" and receipt["dtype"] == sys.argv[2]
          assert receipt["optimizer_steps"] == receipt["reference_optimizer_steps"] == 2
          assert receipt["normalization"] == "selected_raw_features"
          assert receipt["invariance"]["status"] == receipt["controls"]["status"] == receipt["all_empty"]["status"] == "passed"
          print("Padded gradient penalty", sys.argv[2], "passed two updates, invariance and controls")
          PY
            cat "$receipt"
          done
          for dtype in float32 float64; do
            receipt="$RUNNER_TEMP/asan-evidence/clipped-$dtype.json"
            "$python" -I -u -X faulthandler examples/train_clipped.py --dtype "$dtype" --aggregation forward-microbatches --chunk-size 2 --output "$receipt"
            "$python" -I - "$receipt" "$dtype" <<'PY'
          import json
          from pathlib import Path
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["status"] == "passed" and receipt["dtype"] == sys.argv[2]
          assert receipt["method"] == "autograd.grad.is_grads_batched"
          assert receipt["aggregation_method"] == "microbatched_per_example_joint_clip" and receipt["chunk_size_requested"] == 2
          for step in receipt["steps"]:
              chunk = step["chunking"]
              assert chunk["effective_size"] == chunk["max_rows"] == 2
              assert chunk["chunk_rows"] == chunk["forward_rows"] == [2, 2, 1]
              assert chunk["retain_graph"] == [False, False, False] and chunk["global_denominator"] == 5
              assert chunk["seed_shapes"] == [[2, 2], [2, 2], [1, 1]]
          assert receipt["optimizer_steps"] == receipt["reference_optimizer_steps"] == 2
          assert receipt["controls"]["status"] == receipt["invariance"]["status"] == receipt["empty"]["status"] == "passed"
          print("Per-example clipped gradients", sys.argv[2], "passed two updates, invariance and controls")
          PY
            cat "$receipt"
          done
          for dtype in float32 float64; do
            receipt="$RUNNER_TEMP/asan-evidence/forward-ad-$dtype.json"
            "$python" -I -u -X faulthandler examples/train_forward_ad.py --dtype "$dtype" --output "$receipt"
            "$python" -I - "$receipt" "$dtype" <<'PY'
          import json
          from pathlib import Path
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["status"] == "passed" and receipt["dtype"] == sys.argv[2]
          assert receipt["optimizer_steps"] == receipt["reference_optimizer_steps"] == receipt["original_native_optimizer_steps"] == 2
          assert receipt["sensitivity"]["status"] == "passed" and receipt["sensitivity"]["parameters_fixed"]
          assert receipt["inputs_unchanged"] and receipt["installed_package"] and receipt["native_library_loaded"]
          assert receipt["threads"] == receipt["interop_threads"] == 1
          print("Packed forward AD", sys.argv[2], "passed two updates and fixed-parameter sensitivity")
          PY
            cat "$receipt"
          done
          for dtype in float32 float64; do
            receipt="$RUNNER_TEMP/asan-evidence/functional-models-$dtype.json"
            "$python" -I -u -X faulthandler examples/train_functional_models.py --dtype "$dtype" --output "$receipt"
            "$python" -I - "$receipt" "$dtype" <<'PY'
          import json
          from pathlib import Path
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["status"] == "passed" and receipt["dtype"] == sys.argv[2]
          assert receipt["method"] == "torch.func.vmap.grad.functional_call" and receipt["models"] == 3
          assert receipt["optimizer_steps"] == receipt["original_native_optimizer_steps"] == receipt["reference_optimizer_steps"] == 2
          assert receipt["shared_input_gradients"]["status"] == "passed" and receipt["shared_input_gradients"]["sum_differs_from_mean"]
          assert receipt["parameters_stacked_leaf"] and receipt["inputs_unchanged"] and receipt["installed_package"] and receipt["native_library_loaded"]
          assert receipt["threads"] == receipt["interop_threads"] == 1
          print("Functional models", sys.argv[2], "passed two updates and shared-input gradient controls")
          PY
            cat "$receipt"
          done
          for dtype in float32 float64; do
            receipt="$RUNNER_TEMP/asan-evidence/curvature-$dtype.json"
            "$python" -I -u -X faulthandler examples/train_curvature.py --dtype "$dtype" --output "$receipt"
            "$python" -I - "$receipt" "$dtype" <<'PY'
          import json
          from pathlib import Path
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["status"] == "passed" and receipt["dtype"] == sys.argv[2]
          assert receipt["method"] == "torch.func.jvp.grad.functional_call"
          assert receipt["optimizer_steps"] == receipt["original_native_optimizer_steps"] == receipt["reference_optimizer_steps"] == 2
          assert receipt["parameter_tensors"] == 5 and receipt["scalar_parameters"] == 25
          result = receipt["curvature"]
          assert result["status"] == "passed" and result["parameters_fixed"] and result["optimizer_steps"] == 0 and result["directions"] == 2
          assert not result["full_hessian_materialized"] and result["inputs_and_parameters_unchanged"] and result["parameter_grad_fields_unset"]
          assert all(result[key]["status"] == "passed" for key in ("bilinear_symmetry", "linearity", "zero_direction"))
          assert receipt["inputs_unchanged"] and receipt["gradients_and_hvps_finite"] and receipt["installed_package"] and receipt["native_library_loaded"]
          assert receipt["threads"] == receipt["interop_threads"] == 1
          print("Curvature", sys.argv[2], "passed two updates and fixed-parameter HVP controls")
          PY
            cat "$receipt"
          done
          for dtype in float32 float64; do
            receipt="$RUNNER_TEMP/asan-evidence/solve-$dtype.json"
            "$python" -I -u -X faulthandler examples/solve_curvature.py --dtype "$dtype" --output "$receipt"
            "$python" -I - "$receipt" "$dtype" <<'PY'
          import json
          from pathlib import Path
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["status"] == "passed" and receipt["dtype"] == sys.argv[2]
          assert receipt["method"] == "damped_cg.packed_parameter_hvp"
          assert receipt["optimizer_steps"] == receipt["original_native_optimizer_steps"] == receipt["reference_optimizer_steps"] == 2
          result = receipt["solve"]
          assert result["status"] == "converged" and result["parameters_fixed"] and result["optimizer_steps"] == 0
          assert not result["full_hessian_materialized"] and not result["model_updated_with_solution"]
          assert result["inputs_and_parameters_unchanged"] and result["parameter_grad_fields_unset"]
          assert all(result["solve_reports"][route]["status"] == "converged" for route in ("bridge", "original_native_reverse_over_reverse", "reference_hvp"))
          assert all(row["accepted"] and row["norm"] <= row["threshold"] for row in result["independent_residuals"].values())
          assert all(row["products"] <= 33 for row in result["solve_reports"].values())
          assert result["omitted_h_control"]["status"] == "rejected_by_residual" and result["omitted_h_control"]["exceeds_threshold"]
          assert receipt["inputs_unchanged"] and receipt["installed_package"] and receipt["native_library_loaded"]
          assert receipt["threads"] == receipt["interop_threads"] == 1
          print("Damped solve", sys.argv[2], "passed fixed-parameter residual acceptance without another update")
          PY
            cat "$receipt"
          done
          for dtype in float32 float64; do
            receipt="$RUNNER_TEMP/asan-evidence/dynamic-$dtype.json"
            "$python" -I -u -X faulthandler examples/train_dynamic.py --dtype "$dtype" --output "$receipt"
            "$python" -I - "$receipt" "$dtype" <<'PY'
          import json
          from pathlib import Path
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["status"] == "passed" and receipt["dtype"] == sys.argv[2]
          assert receipt["method"] == "torch.compile.aot_eager.dynamic.packed_training"
          assert receipt["optimizer_steps"] == receipt["compiled_optimizer_steps"] == receipt["native_optimizer_steps"] == receipt["original_native_optimizer_steps"] == receipt["reference_optimizer_steps"] == 5
          assert len(receipt["steps"]) == 5
          route = receipt["compile"]
          assert route["backend"] == "aot_eager" and route["fullgraph"] and route["dynamic"] and route["compile_calls"] == 1
          assert not route["graph_count_observed"] and not route["optimizer_inside_compiled_region"]
          assert receipt["same_model_parameter_and_optimizer_objects"] and receipt["changed_partition_at_same_metadata"] and receipt["returned_shape_with_changed_partition"]
          assert receipt["inputs_unchanged"] and receipt["initial_parameters_unchanged"] and receipt["gradients_finite"]
          assert receipt["installed_package"] and receipt["native_library_loaded"] and receipt["threads"] == receipt["interop_threads"] == 1
          for step in receipt["steps"]:
              assert step["all_routes_all_parameter_blocks_changed"] and step["empty_group_pooled_zero"]
              assert step["same_parameter_objects"] and step["same_optimizer_objects"] and step["inputs_unchanged"]
          print("Dynamic training", sys.argv[2], "passed five changing-shape updates through the public backend string")
          PY
            cat "$receipt"
          done
          for dtype in float32 float64; do
            receipt="$RUNNER_TEMP/asan-evidence/resume-$dtype.json"
            "$python" -I -u -X faulthandler examples/resume_training.py --dtype "$dtype" --directory "$RUNNER_TEMP/asan-evidence/resume-$dtype" --output "$receipt" > "$RUNNER_TEMP/asan-evidence/resume-$dtype.stdout.log" 2>&1
            "$python" -I - "$receipt" "$dtype" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["status"] == "passed" and receipt["dtype"] == sys.argv[2]
          assert receipt["method"] == "state_dict.packed_training_resume" and receipt["device"] == "cpu"
          assert receipt["optimizer_steps"] == 5 and receipt["producer_steps"] == 2 and receipt["resumed_steps"] == 3 and receipt["checkpoint_cursor"] == 2
          assert receipt["optimizer"] == "SGD" and receipt["learning_rate"] == 0.03 and receipt["momentum"] == 0.8
          assert receipt["same_native_exact"] and receipt["primitive_comparisons_passed"] and receipt["independent_momentum_recurrence"]
          assert receipt["model_only_reset_optimizer_diverged"] and receipt["no_live_rng_continuation"]
          assert receipt["input_sources_unchanged"] and receipt["loaded_state_storage_independent"] and len(receipt["steps"]) == 5
          assert receipt["checkpoint_bytes"] <= receipt["checkpoint_byte_limit"]
          process_ids = [receipt["process_ids"][name] for name in ("parent", "producer", "resumer")]
          assert receipt["distinct_processes"] and len(set(process_ids)) == 3 and all(type(value) is int and value > 0 for value in process_ids)
          assert receipt["checkpoint_unchanged"] and receipt["checkpoint_bytes"] > 0 and re.fullmatch(r"[0-9a-f]{64}", receipt["checkpoint_sha256"])
          assert receipt["installed_package"] and receipt["native_library_loaded"] and receipt["threads"] == receipt["interop_threads"] == 1
          print("Training resume", sys.argv[2], "passed two producer updates and three fresh-process continuation updates")
          PY
            cat "$receipt"
          done
          for dtype in float32 float64; do
            receipt="$RUNNER_TEMP/asan-evidence/checkpointed-$dtype.json"
            "$python" -I -u -X faulthandler examples/train_checkpointed.py --dtype "$dtype" --output "$receipt"
            "$python" -I "$GITHUB_WORKSPACE/scripts/check_activation_receipt.py" "$receipt" "$dtype"
            cat "$receipt"
          done
          for dtype in float32 float64; do
            receipt="$RUNNER_TEMP/asan-evidence/stochastic-$dtype.json"
            "$python" -I -u -X faulthandler examples/resume_stochastic.py --dtype "$dtype" --directory "$RUNNER_TEMP/asan-evidence/stochastic-$dtype" --output "$receipt" > "$RUNNER_TEMP/asan-evidence/stochastic-$dtype.stdout.log" 2>&1
            "$python" -I "$GITHUB_WORKSPACE/scripts/check_stochastic_receipt.py" "$receipt" "$dtype"
            cat "$receipt"
          done
          wheels=("$RUNNER_TEMP"/asan-wheel/*.whl)
          if (( ${#wheels[@]} != 1 )) || ! test -f "${wheels[0]}"; then
            echo 'Expected exactly one instrumented wheel for the smoke receipt' >&2
            exit 1
          fi
          mkdir "$RUNNER_TEMP/asan-evidence/padded-export"
          for dtype in float32 float64; do
            bundle="$RUNNER_TEMP/asan-evidence/padded-export/$dtype"
            producer="$RUNNER_TEMP/asan-evidence/padded-export/producer-$dtype.json"
            consumer="$RUNNER_TEMP/asan-evidence/padded-export/consumer-$dtype.json"
            "$python" -I -u -X faulthandler examples/export_padded.py --dtype "$dtype" --directory "$bundle" --source-revision "$RAGGED_REVISION" --wheel "${wheels[0]}" --output "$producer"
            manifest_sha256="$("$python" -I - "$producer" "$dtype" "$RAGGED_REVISION" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          producer = json.loads(Path(sys.argv[1]).read_text())
          assert producer["status"] == "passed" and producer["dtype"] == sys.argv[2]
          assert producer["source_revision"] == sys.argv[3]
          assert producer["training"]["optimizer_steps"] == 2
          assert re.fullmatch(r"[0-9a-f]{64}", producer["manifest_sha256"])
          print(producer["manifest_sha256"])
          PY
            )"
            "$python" -I -u -X faulthandler examples/predict_padded.py --directory "$bundle" --manifest-sha256 "$manifest_sha256" --output "$consumer"
            "$python" -I - "$producer" "$consumer" "$bundle/manifest.json" "$dtype" "$RAGGED_REVISION" <<'PY'
          import json
          from pathlib import Path
          import sys

          producer, consumer, manifest = (json.loads(Path(path).read_text()) for path in sys.argv[1:4])
          assert consumer["status"] == "passed" and consumer["dtype"] == sys.argv[4]
          assert producer["source_revision"] == consumer["source_revision"] == sys.argv[5]
          assert consumer["expected_manifest_sha256"] == producer["manifest_sha256"]
          assert len(manifest["cases"]) > 0 and len(consumer["cases"]) == len(manifest["cases"])
          assert consumer["training_modules_loaded"] == []
          print("Padded export", sys.argv[4], "passed two training updates and", len(consumer["cases"]), "fresh-process cases")
          PY
            cat "$producer" "$consumer"
          done
          "$python" -I -u -X faulthandler examples/learn_sets.py --smoke --source-revision "$RAGGED_REVISION" --wheel "${wheels[0]}" --output "$RUNNER_TEMP/asan-evidence/study-smoke.json"
      - name: Qualify generated second derivatives with a separate bounded campaign
        working-directory: ${{ runner.temp }}/ragged-asan-consumer
        run: |
          set -euo pipefail
          export LD_PRELOAD="$ASAN_RUNTIME:$CXX_STDLIB"
          python="$RUNNER_TEMP/ragged-asan/bin/python"
          "$python" -I -u -X faulthandler native_campaign.py --cases tests/generated_second_order_cases.py --seconds "$SECOND_ORDER_SECONDS" --seed 20261020 --output "$RUNNER_TEMP/asan-evidence/second-order-campaign.json"
          "$python" -I -u -X faulthandler native_campaign.py --cases tests/generated_second_order_cases.py --seconds 5 --seed 20261020 --output "$RUNNER_TEMP/asan-evidence/second-order-replay.json"
          "$python" -I - <<'PY'
          from hashlib import sha256
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["RUNNER_TEMP"]) / "asan-evidence"
          baseline = json.loads((evidence / "campaign.json").read_text())
          assert baseline["status"] == "passed"
          cases = Path("tests/generated_second_order_cases.py")
          expected_cases_sha256 = sha256(cases.read_bytes()).hexdigest()
          checkout_cases = Path(os.environ["GITHUB_WORKSPACE"]) / cases
          assert expected_cases_sha256 == sha256(checkout_cases.read_bytes()).hexdigest()
          expected_native_sha256 = sha256(Path(baseline["native_library"]).read_bytes()).hexdigest()
          assert expected_native_sha256 == baseline["native_sha256"]
          core = ("packed_second_vjp", "padded_second_vjp", "second_order_oracle",
                  "second_public_packed", "second_private_packed",
                  "second_public_padded", "second_private_padded")
          for name, seconds in (("second-order-campaign", int(os.environ["SECOND_ORDER_SECONDS"])),
                                ("second-order-replay", 5)):
              receipt = json.loads((evidence / f"{name}.json").read_text())
              assert receipt["status"] == "passed" and receipt["iterations"] > 0
              assert receipt["seed"] == 20261020 and receipt["requested_seconds"] == seconds
              assert receipt["source_revision"] == baseline["source_revision"] == os.environ["RAGGED_REVISION"]
              assert receipt["cases_sha256"] == expected_cases_sha256
              assert receipt["native_library"] == baseline["native_library"]
              assert receipt["native_sha256"] == expected_native_sha256
              assert receipt["package"] == baseline["package"]
              assert all(receipt["counters"].get(key, 0) >= receipt["iterations"] for key in core)
              print(name, "passed", receipt["iterations"], "iterations", {key: receipt["counters"][key] for key in core})
          print("Second-order cases SHA256:", expected_cases_sha256)
          print("Instrumented native SHA256:", expected_native_sha256)
          print("Tested source:", os.environ["RAGGED_REVISION"])
          PY

      - name: Retain campaign and negative-control evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-asan-${{ github.sha }}
          path: ${{ runner.temp }}/asan-evidence
          if-no-files-found: warn
          retention-days: 14
