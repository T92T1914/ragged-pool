name: Windows CPU package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-wheel:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MAX_JOBS: '2'
      PYTHONNOUSERSITE: '1'
      PYTHONPATH: ''
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select CPython 3.11.8 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.8'
          architecture: x64

      - name: Prepare separate build and acceptance environments
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('ragged-build', 'ragged-accept')) {
            $venv = Join-Path $env:RUNNER_TEMP $name
            python -m venv $venv
            if ($LASTEXITCODE -ne 0) { throw "Could not create $name" }
            $python = Join-Path $venv 'Scripts\python.exe'
            & $python -m pip --isolated install 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
            if ($LASTEXITCODE -ne 0) { throw "PyTorch installation failed in $name" }
            & $python -m pip --isolated install -r requirements-lock.txt
            if ($LASTEXITCODE -ne 0) { throw "Pinned dependencies failed in $name" }
          }

      - name: Build with the existing MSVC 14.44 x64 toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Visual Studio 2022 C++ tools are required' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars)) { throw 'vcvars64.bat is missing' }
          $python = Join-Path $env:RUNNER_TEMP 'ragged-build\Scripts\python.exe'
          $buildCommand = Join-Path $env:RUNNER_TEMP 'build-ragged.cmd'
          @"
          @echo off
          call "$vcvars" -vcvars_ver=14.44
          if errorlevel 1 exit /b %errorlevel%
          set DISTUTILS_USE_SDK=1
          set CL=/Bv
          set VCToolsVersion
          "$python" -m pip --isolated wheel . --no-build-isolation --no-deps --wheel-dir dist
          exit /b %errorlevel%
          "@ | Set-Content -LiteralPath $buildCommand -Encoding ascii
          & cmd.exe /d /c $buildCommand
          if ($LASTEXITCODE -ne 0) { throw 'Native wheel build failed' }

      - name: Install the wheel into the fresh acceptance environment
        run: |
          $ErrorActionPreference = 'Stop'
          $wheels = @(Get-ChildItem -LiteralPath dist -Filter '*.whl')
          if ($wheels.Count -ne 1) { throw 'Expected exactly the wheel built by this job' }
          $python = Join-Path $env:RUNNER_TEMP 'ragged-accept\Scripts\python.exe'
          & $python -m pip --isolated install --no-deps $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Wheel installation failed' }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Installed dependency consistency failed' }
          $work = Join-Path $env:RUNNER_TEMP 'ragged-consumer'
          New-Item -ItemType Directory -Path $work | Out-Null
          Copy-Item -LiteralPath tests -Destination $work -Recurse
          Copy-Item -LiteralPath examples -Destination $work -Recurse
          Copy-Item -LiteralPath examples\train_sets.py -Destination $work
          Copy-Item -LiteralPath scripts\check_installed.py -Destination $work
          New-Item -ItemType Directory -Path (Join-Path $work 'scripts') | Out-Null
          Copy-Item -LiteralPath scripts\check_installed.py,scripts\check_sdist.py,scripts\check_stochastic_receipt.py,scripts\check_activation_receipt.py -Destination (Join-Path $work 'scripts')
          # Read-only source fixtures serve mocked build/loader tests only.
          # Numerical tests continue importing the ordinary installed package.
          $fixtures = Join-Path $work 'src\ragged_pool'
          New-Item -ItemType Directory -Path $fixtures -Force | Out-Null
          Copy-Item -LiteralPath setup.py -Destination $work
          Copy-Item -LiteralPath src\ragged_pool\_build.py,src\ragged_pool\__init__.py -Destination $fixtures
          foreach ($fixture in @((Join-Path $work 'setup.py'), (Join-Path $fixtures '_build.py'), (Join-Path $fixtures '__init__.py'))) {
            (Get-Item -LiteralPath $fixture).IsReadOnly = $true
          }
          "RAGGED_WHEEL=$($wheels[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check installed identity, mathematics, registration and training
        working-directory: ${{ runner.temp }}/ragged-consumer
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:RUNNER_TEMP 'ragged-accept\Scripts\python.exe'
          & $python -I check_installed.py --checkout $env:GITHUB_WORKSPACE --wheel $env:RAGGED_WHEEL
          if ($LASTEXITCODE -ne 0) { throw 'Installed wheel identity or license check failed' }
          & $python -I -m pytest -q --import-mode=importlib tests
          if ($LASTEXITCODE -ne 0) { throw 'Installed package tests failed' }
          & $python -I train_sets.py --dtype float32
          if ($LASTEXITCODE -ne 0) { throw 'Installed float32 consumer failed' }
          & $python -I train_sets.py --dtype float64
          if ($LASTEXITCODE -ne 0) { throw 'Installed float64 consumer failed' }
          & $python -I examples\train_padded.py --dtype float32
          if ($LASTEXITCODE -ne 0) { throw 'Installed padded float32 consumer failed' }
          & $python -I examples\train_padded.py --dtype float64
          if ($LASTEXITCODE -ne 0) { throw 'Installed padded float64 consumer failed' }
          & $python -I examples\train_padded.py --compiled --dtype float32 --output padded-compiled-float32.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed compiled padded float32 consumer failed' }
          & $python -I examples\train_padded.py --compiled --dtype float64 --output padded-compiled-float64.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed compiled padded float64 consumer failed' }
          & $python -I examples\train_gradient_penalty.py --dtype float32 --output gradient-penalty-float32.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed gradient penalty float32 consumer failed' }
          & $python -I examples\train_gradient_penalty.py --dtype float64 --output gradient-penalty-float64.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed gradient penalty float64 consumer failed' }
          foreach ($dtype in @('float32', 'float64')) {
            $receiptPath = "padded-gradient-penalty-$dtype.json"
            & $python -I examples\train_padded_gradient_penalty.py --dtype $dtype --output $receiptPath
            if ($LASTEXITCODE -ne 0) { throw "Installed padded gradient penalty $dtype consumer failed" }
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
            if ($receipt.status -ne 'passed' -or $receipt.dtype -ne $dtype -or $receipt.optimizer_steps -ne 2 -or $receipt.reference_optimizer_steps -ne 2) {
              throw "Unexpected padded gradient penalty $dtype training receipt"
            }
            if ($receipt.normalization -ne 'selected_raw_features' -or $receipt.invariance.status -ne 'passed' -or $receipt.controls.status -ne 'passed' -or $receipt.all_empty.status -ne 'passed') {
              throw "Incomplete padded gradient penalty $dtype invariance or controls"
            }
            Get-Content -LiteralPath $receiptPath
          }
          foreach ($dtype in @('float32', 'float64')) {
            $receiptPath = "clipped-$dtype.json"
            & $python -I examples\train_clipped.py --dtype $dtype --aggregation forward-microbatches --chunk-size 2 --output $receiptPath
            if ($LASTEXITCODE -ne 0) { throw "Installed clipped gradient $dtype consumer failed" }
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
            if ($receipt.status -ne 'passed' -or $receipt.dtype -ne $dtype -or $receipt.method -ne 'autograd.grad.is_grads_batched' -or $receipt.optimizer_steps -ne 2 -or $receipt.reference_optimizer_steps -ne 2) {
              throw "Unexpected clipped gradient $dtype training receipt"
            }
            if ($receipt.controls.status -ne 'passed' -or $receipt.invariance.status -ne 'passed' -or $receipt.empty.status -ne 'passed') {
              throw "Incomplete clipped gradient $dtype invariance or controls"
            }
            if ($receipt.aggregation_method -ne 'microbatched_per_example_joint_clip' -or $receipt.chunk_size_requested -ne 2) {
              throw "Unexpected clipped gradient $dtype aggregation route"
            }
            foreach ($step in $receipt.steps) {
              $chunk = $step.chunking
              if ($chunk.effective_size -ne 2 -or $chunk.max_rows -ne 2 -or ($chunk.chunk_rows -join ',') -ne '2,2,1' -or ($chunk.forward_rows -join ',') -ne '2,2,1' -or ($chunk.retain_graph -join ',') -ne 'False,False,False' -or $chunk.global_denominator -ne 5) {
                throw "Unexpected clipped gradient $dtype partition or graph lifecycle"
              }
              if ((($chunk.seed_shapes | ForEach-Object { $_ -join ',' }) -join ';') -ne '2,2;2,2;1,1') {
                throw "Unexpected clipped gradient $dtype selector shapes"
              }
            }
            Get-Content -LiteralPath $receiptPath
          }
          foreach ($dtype in @('float32', 'float64')) {
            $receiptPath = "forward-ad-$dtype.json"
            & $python -I examples\train_forward_ad.py --dtype $dtype --output $receiptPath
            if ($LASTEXITCODE -ne 0) { throw "Installed forward AD $dtype consumer failed" }
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
            if ($receipt.status -ne 'passed' -or $receipt.dtype -ne $dtype -or $receipt.optimizer_steps -ne 2 -or $receipt.reference_optimizer_steps -ne 2 -or $receipt.original_native_optimizer_steps -ne 2) {
              throw "Unexpected forward AD $dtype training receipt"
            }
            if ($receipt.sensitivity.status -ne 'passed' -or -not $receipt.sensitivity.parameters_fixed -or -not $receipt.inputs_unchanged -or -not $receipt.installed_package -or $receipt.threads -ne 1 -or $receipt.interop_threads -ne 1) {
              throw "Incomplete installed forward AD $dtype sensitivity receipt"
            }
            Get-Content -LiteralPath $receiptPath
          }
          foreach ($dtype in @('float32', 'float64')) {
            $receiptPath = "functional-models-$dtype.json"
            & $python -I examples\train_functional_models.py --dtype $dtype --output $receiptPath
            if ($LASTEXITCODE -ne 0) { throw "Installed functional models $dtype consumer failed" }
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
            if ($receipt.status -ne 'passed' -or $receipt.dtype -ne $dtype -or $receipt.method -ne 'torch.func.vmap.grad.functional_call' -or $receipt.models -ne 3 -or $receipt.optimizer_steps -ne 2 -or $receipt.original_native_optimizer_steps -ne 2 -or $receipt.reference_optimizer_steps -ne 2) {
              throw "Unexpected functional models $dtype training receipt"
            }
            if ($receipt.shared_input_gradients.status -ne 'passed' -or -not $receipt.shared_input_gradients.sum_differs_from_mean -or -not $receipt.parameters_stacked_leaf -or -not $receipt.inputs_unchanged -or -not $receipt.installed_package -or $receipt.threads -ne 1 -or $receipt.interop_threads -ne 1) {
              throw "Incomplete functional models $dtype gradient or ownership receipt"
            }
            Get-Content -LiteralPath $receiptPath
          }
          foreach ($dtype in @('float32', 'float64')) {
            $receiptPath = "curvature-$dtype.json"
            & $python -I examples\train_curvature.py --dtype $dtype --output $receiptPath
            if ($LASTEXITCODE -ne 0) { throw "Installed curvature $dtype consumer failed" }
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
            if ($receipt.status -ne 'passed' -or $receipt.dtype -ne $dtype -or $receipt.method -ne 'torch.func.jvp.grad.functional_call' -or $receipt.optimizer_steps -ne 2 -or $receipt.original_native_optimizer_steps -ne 2 -or $receipt.reference_optimizer_steps -ne 2 -or $receipt.parameter_tensors -ne 5 -or $receipt.scalar_parameters -ne 25) {
              throw "Unexpected curvature $dtype training receipt"
            }
            if ($receipt.curvature.status -ne 'passed' -or -not $receipt.curvature.parameters_fixed -or $receipt.curvature.optimizer_steps -ne 0 -or $receipt.curvature.directions -ne 2 -or $receipt.curvature.full_hessian_materialized -or -not $receipt.curvature.inputs_and_parameters_unchanged -or -not $receipt.curvature.parameter_grad_fields_unset) {
              throw "Incomplete curvature $dtype fixed-parameter receipt"
            }
            if ($receipt.curvature.bilinear_symmetry.status -ne 'passed' -or $receipt.curvature.linearity.status -ne 'passed' -or $receipt.curvature.zero_direction.status -ne 'passed' -or -not $receipt.inputs_unchanged -or -not $receipt.gradients_and_hvps_finite -or -not $receipt.installed_package -or -not $receipt.native_library_loaded -or $receipt.threads -ne 1 -or $receipt.interop_threads -ne 1) {
              throw "Incomplete curvature $dtype controls or ownership receipt"
            }
            Get-Content -LiteralPath $receiptPath
          }
          foreach ($dtype in @('float32', 'float64')) {
            $receiptPath = "solve-$dtype.json"
            & $python -I examples\solve_curvature.py --dtype $dtype --output $receiptPath
            if ($LASTEXITCODE -ne 0) { throw "Installed damped solve $dtype consumer failed" }
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
            if ($receipt.status -ne 'passed' -or $receipt.dtype -ne $dtype -or $receipt.method -ne 'damped_cg.packed_parameter_hvp' -or $receipt.optimizer_steps -ne 2 -or $receipt.original_native_optimizer_steps -ne 2 -or $receipt.reference_optimizer_steps -ne 2) {
              throw "Unexpected damped solve $dtype training receipt"
            }
            $solve = $receipt.solve
            if ($solve.status -ne 'converged' -or -not $solve.parameters_fixed -or $solve.full_hessian_materialized -or $solve.optimizer_steps -ne 0 -or $solve.model_updated_with_solution -or -not $solve.inputs_and_parameters_unchanged -or -not $solve.parameter_grad_fields_unset) {
              throw "Incomplete damped solve $dtype fixed-parameter receipt"
            }
            foreach ($route in @('bridge', 'original_native_reverse_over_reverse', 'reference_hvp')) {
              if ($solve.solve_reports.$route.status -ne 'converged') { throw "Damped solve $dtype route $route did not converge" }
              if (-not $solve.independent_residuals.$route.accepted -or $solve.independent_residuals.$route.norm -gt $solve.independent_residuals.$route.threshold -or $solve.solve_reports.$route.products -gt 33) { throw "Damped solve $dtype route $route failed residual or product bounds" }
            }
            if ($solve.omitted_h_control.status -ne 'rejected_by_residual' -or -not $solve.omitted_h_control.exceeds_threshold) { throw "Damped solve $dtype omitted-H control did not reject" }
            if (-not $receipt.inputs_unchanged -or -not $receipt.installed_package -or -not $receipt.native_library_loaded -or $receipt.threads -ne 1 -or $receipt.interop_threads -ne 1) {
              throw "Incomplete damped solve $dtype ownership or installed identity"
            }
            Get-Content -LiteralPath $receiptPath
          }
          foreach ($dtype in @('float32', 'float64')) {
            $receiptPath = "dynamic-$dtype.json"
            & $python -I examples\train_dynamic.py --dtype $dtype --output $receiptPath
            if ($LASTEXITCODE -ne 0) { throw "Installed dynamic training $dtype consumer failed" }
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
            if ($receipt.status -ne 'passed' -or $receipt.dtype -ne $dtype -or $receipt.method -ne 'torch.compile.aot_eager.dynamic.packed_training' -or $receipt.optimizer_steps -ne 5 -or $receipt.compiled_optimizer_steps -ne 5 -or $receipt.native_optimizer_steps -ne 5 -or $receipt.original_native_optimizer_steps -ne 5 -or $receipt.reference_optimizer_steps -ne 5 -or $receipt.steps.Count -ne 5) {
              throw "Unexpected dynamic training $dtype update receipt"
            }
            if ($receipt.compile.backend -ne 'aot_eager' -or -not $receipt.compile.fullgraph -or -not $receipt.compile.dynamic -or $receipt.compile.compile_calls -ne 1 -or $receipt.compile.graph_count_observed -or $receipt.compile.optimizer_inside_compiled_region) {
              throw "Unexpected dynamic training $dtype compiler route"
            }
            if (-not $receipt.same_model_parameter_and_optimizer_objects -or -not $receipt.changed_partition_at_same_metadata -or -not $receipt.returned_shape_with_changed_partition -or -not $receipt.inputs_unchanged -or -not $receipt.initial_parameters_unchanged -or -not $receipt.gradients_finite -or -not $receipt.installed_package -or -not $receipt.native_library_loaded -or $receipt.threads -ne 1 -or $receipt.interop_threads -ne 1) {
              throw "Incomplete dynamic training $dtype ownership or installed identity"
            }
            foreach ($step in $receipt.steps) {
              if (-not $step.all_routes_all_parameter_blocks_changed -or -not $step.empty_group_pooled_zero -or -not $step.same_parameter_objects -or -not $step.same_optimizer_objects -or -not $step.inputs_unchanged) { throw "Incomplete dynamic training $dtype step" }
            }
            Get-Content -LiteralPath $receiptPath
          }
          foreach ($dtype in @('float32', 'float64')) {
            $receiptPath = "resume-$dtype.json"
            & $python -I examples\resume_training.py --dtype $dtype --directory "resume-$dtype" --output $receiptPath *> "resume-$dtype.stdout.log"
            if ($LASTEXITCODE -ne 0) { throw "Installed training resume $dtype consumer failed" }
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
            if ($receipt.status -ne 'passed' -or $receipt.dtype -ne $dtype -or $receipt.method -ne 'state_dict.packed_training_resume' -or $receipt.device -ne 'cpu' -or $receipt.optimizer_steps -ne 5 -or $receipt.producer_steps -ne 2 -or $receipt.resumed_steps -ne 3 -or $receipt.checkpoint_cursor -ne 2) {
              throw "Unexpected training resume $dtype trajectory receipt"
            }
            if ($receipt.optimizer -ne 'SGD' -or $receipt.learning_rate -ne 0.03 -or $receipt.momentum -ne 0.8 -or -not $receipt.same_native_exact -or -not $receipt.primitive_comparisons_passed -or -not $receipt.independent_momentum_recurrence -or -not $receipt.model_only_reset_optimizer_diverged) {
              throw "Incomplete training resume $dtype optimizer or comparison controls"
            }
            $processIds = @($receipt.process_ids.parent, $receipt.process_ids.producer, $receipt.process_ids.resumer)
            if (-not $receipt.distinct_processes -or @($processIds | Select-Object -Unique).Count -ne 3 -or @($processIds | Where-Object { $_ -le 0 }).Count -ne 0 -or -not $receipt.checkpoint_unchanged -or $receipt.checkpoint_sha256 -notmatch '^[0-9a-f]{64}$' -or $receipt.checkpoint_bytes -le 0) {
              throw "Incomplete training resume $dtype process or checkpoint identity"
            }
            if (-not $receipt.no_live_rng_continuation -or -not $receipt.input_sources_unchanged -or -not $receipt.loaded_state_storage_independent -or $receipt.steps.Count -ne 5 -or $receipt.checkpoint_bytes -gt $receipt.checkpoint_byte_limit -or -not $receipt.installed_package -or -not $receipt.native_library_loaded -or $receipt.threads -ne 1 -or $receipt.interop_threads -ne 1) {
              throw "Incomplete training resume $dtype installed identity or scope"
            }
            Get-Content -LiteralPath $receiptPath
          }
          foreach ($dtype in @('float32', 'float64')) {
            $receiptPath = "checkpointed-$dtype.json"
            & $python -I examples\train_checkpointed.py --dtype $dtype --output $receiptPath
            if ($LASTEXITCODE -ne 0) { throw "Installed activation recomputation $dtype consumer failed" }
            & $python -I (Join-Path $env:GITHUB_WORKSPACE 'scripts\check_activation_receipt.py') $receiptPath $dtype
            if ($LASTEXITCODE -ne 0) { throw "Activation recomputation $dtype receipt failed" }
          }
          foreach ($dtype in @('float32', 'float64')) {
            $receiptPath = "stochastic-$dtype.json"
            & $python -I examples\resume_stochastic.py --dtype $dtype --directory "stochastic-$dtype" --output $receiptPath *> "stochastic-$dtype.stdout.log"
            if ($LASTEXITCODE -ne 0) { throw "Installed stochastic resume $dtype consumer failed" }
            & $python -I "$env:GITHUB_WORKSPACE/scripts/check_stochastic_receipt.py" $receiptPath $dtype
            if ($LASTEXITCODE -ne 0) { throw "Installed stochastic resume $dtype receipt failed" }
            Get-Content -LiteralPath $receiptPath
          }
          $revision = git -C $env:GITHUB_WORKSPACE rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the smoke test source revision' }
          $paddedExportRoot = Join-Path $env:RUNNER_TEMP 'ragged-padded-export'
          New-Item -ItemType Directory -Path $paddedExportRoot | Out-Null
          foreach ($dtype in @('float32', 'float64')) {
            $bundle = Join-Path $paddedExportRoot $dtype
            $producerPath = Join-Path $paddedExportRoot "producer-$dtype.json"
            $consumerPath = Join-Path $paddedExportRoot "consumer-$dtype.json"
            & $python -I examples\export_padded.py --dtype $dtype --directory $bundle --source-revision $revision --wheel $env:RAGGED_WHEEL --output $producerPath
            if ($LASTEXITCODE -ne 0) { throw "Installed padded export $dtype producer failed" }
            $producer = Get-Content -LiteralPath $producerPath -Raw | ConvertFrom-Json
            if ($producer.status -ne 'passed' -or $producer.dtype -ne $dtype -or $producer.source_revision -ne $revision -or $producer.training.optimizer_steps -ne 2) {
              throw "Unexpected padded export $dtype producer receipt"
            }
            if ($producer.manifest_sha256 -notmatch '^[0-9a-f]{64}$') { throw 'Padded manifest digest is missing or invalid' }
            & $python -I examples\predict_padded.py --directory $bundle --manifest-sha256 $producer.manifest_sha256 --output $consumerPath
            if ($LASTEXITCODE -ne 0) { throw "Fresh installed padded export $dtype predictor failed" }
            $consumer = Get-Content -LiteralPath $consumerPath -Raw | ConvertFrom-Json
            $manifest = Get-Content -LiteralPath (Join-Path $bundle 'manifest.json') -Raw | ConvertFrom-Json
            if ($consumer.status -ne 'passed' -or $consumer.dtype -ne $dtype -or $consumer.source_revision -ne $revision -or $consumer.expected_manifest_sha256 -ne $producer.manifest_sha256) {
              throw "Unexpected padded export $dtype predictor receipt"
            }
            if ($manifest.cases.Count -lt 1 -or $consumer.cases.Count -ne $manifest.cases.Count -or $consumer.training_modules_loaded.Count -ne 0) {
              throw "Incomplete padded export $dtype fresh-process cases"
            }
            Write-Output "Padded export $dtype passed two training updates and $($consumer.cases.Count) fresh-process cases"
            Get-Content -LiteralPath $producerPath,$consumerPath
          }
          & $python -I examples\learn_sets.py --smoke --source-revision $revision --wheel $env:RAGGED_WHEEL --output study-smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed study smoke test failed' }
          $artifact = Join-Path $env:RUNNER_TEMP 'ragged-export'
          & $python -I examples\export_sets.py --smoke --directory $artifact --source-revision $revision --wheel $env:RAGGED_WHEEL --output export-producer.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed trained export producer failed' }
          $exportReceipt = Get-Content -LiteralPath export-producer.json -Raw | ConvertFrom-Json
          & $python -I examples\predict_sets.py --directory $artifact --manifest-sha256 $exportReceipt.artifact.manifest_sha256 --output export-consumer.json
          if ($LASTEXITCODE -ne 0) { throw 'Fresh installed exported consumer failed' }

      - name: Train the installed two-rank CPU consumer
        working-directory: ${{ runner.temp }}/ragged-consumer
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:RUNNER_TEMP 'ragged-accept\Scripts\python.exe'
          $revision = git -C $env:GITHUB_WORKSPACE rev-parse HEAD
          $tree = git -C $env:GITHUB_WORKSPACE rev-parse 'HEAD^{tree}'
          foreach ($dtype in @('float32', 'float64')) {
            & $python -I -B examples\train_distributed.py --dtype $dtype --directory "distributed-$dtype" --output "distributed-$dtype.json" --wheel $env:RAGGED_WHEEL --source-revision $revision --source-tree $tree
            if ($LASTEXITCODE -ne 0) { throw "Two-rank CPU training failed for $dtype" }
          }

      - name: Retain two-rank CPU receipts and worker logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributed-cpu-${{ github.sha }}
          path: ${{ runner.temp }}/ragged-consumer/distributed-*
          if-no-files-found: warn
          retention-days: 14

      - name: Archive the exact tested source
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve tested revision' }
          git -c core.autocrlf=false archive --format=zip --output "dist/ragged_pool-source-$revision.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Write-Output "Tested source: $revision"

      - name: Retain the accepted wheel and source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-cpu-${{ github.sha }}
          path: |
            dist/*.whl
            dist/ragged_pool-source-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Retain packed forward AD consumer receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forward-ad-${{ github.sha }}
          path: ${{ runner.temp }}/ragged-consumer/forward-ad-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Retain curvature consumer receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: curvature-${{ github.sha }}
          path: ${{ runner.temp }}/ragged-consumer/curvature-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Retain damped solve consumer receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: damped-solve-${{ github.sha }}
          path: ${{ runner.temp }}/ragged-consumer/solve-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Retain packed dynamic training receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dynamic-training-${{ github.sha }}
          path: ${{ runner.temp }}/ragged-consumer/dynamic-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Retain training resume checkpoints, child logs and receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: training-resume-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ragged-consumer/resume-*.json
            ${{ runner.temp }}/ragged-consumer/resume-*.stdout.log
            ${{ runner.temp }}/ragged-consumer/resume-float32
            ${{ runner.temp }}/ragged-consumer/resume-float64
          if-no-files-found: warn
          retention-days: 14

      - name: Retain activation recomputation receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: activation-recomputation-${{ github.sha }}
          path: ${{ runner.temp }}/ragged-consumer/checkpointed-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Retain stochastic resume checkpoints, child logs and receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stochastic-resume-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ragged-consumer/stochastic-*.json
            ${{ runner.temp }}/ragged-consumer/stochastic-*.stdout.log
            ${{ runner.temp }}/ragged-consumer/stochastic-float32
            ${{ runner.temp }}/ragged-consumer/stochastic-float64
          if-no-files-found: warn
          retention-days: 14

      - name: Retain functional model consumer receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: functional-models-${{ github.sha }}
          path: ${{ runner.temp }}/ragged-consumer/functional-models-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Retain compiled padded consumer receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiled-padded-${{ github.sha }}
          path: ${{ runner.temp }}/ragged-consumer/padded-compiled-*.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain gradient penalty consumer receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradient-penalty-${{ github.sha }}
          path: ${{ runner.temp }}/ragged-consumer/gradient-penalty-*.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain padded gradient penalty consumer receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: padded-gradient-penalty-${{ github.sha }}
          path: ${{ runner.temp }}/ragged-consumer/padded-gradient-penalty-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Retain padded export bundles and fresh predictor receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: padded-export-${{ github.sha }}
          path: ${{ runner.temp }}/ragged-padded-export
          if-no-files-found: warn
          retention-days: 14

      - name: Retain per-example clipped gradient consumer receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clipped-gradients-${{ github.sha }}
          path: ${{ runner.temp }}/ragged-consumer/clipped-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Retain the installed study smoke receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: study-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/ragged-consumer/study-smoke.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain the trained export round trip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trained-export-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ragged-export
            ${{ runner.temp }}/ragged-consumer/export-producer.json
            ${{ runner.temp }}/ragged-consumer/export-consumer.json
          if-no-files-found: error
          retention-days: 14

  release:
    needs: installed-wheel
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Check out the tested release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the accepted wheel and source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-cpu-${{ github.sha }}
          path: ${{ runner.temp }}/ragged-release-assets

      - name: Create a draft, upload both assets and publish
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          if ($tag -ne 'v0.1.0') { throw 'This publication route is scoped to v0.1.0' }
          $notes = Join-Path $env:GITHUB_WORKSPACE 'docs\releases\v0.1.0.md'
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) { throw 'Release notes are missing' }
          $assetDirectory = Join-Path $env:RUNNER_TEMP 'ragged-release-assets'
          $expectedNames = @('ragged_pool-0.1.0-cp311-cp311-win_amd64.whl', "ragged_pool-source-$($env:RELEASE_SHA).zip")
          $files = @(Get-ChildItem -LiteralPath $assetDirectory -File)
          if (Compare-Object $expectedNames @($files.Name)) { throw 'Release artifacts differ from the expected wheel and source archive' }
          $existingTags = @(gh api --paginate "repos/$($env:GH_REPO)/releases" --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing releases' }
          if ($existingTags -contains $tag) { throw "A release or draft for $tag already exists. Inspect it before retrying. No assets were changed." }
          gh release create $tag --repo $env:GH_REPO --draft --verify-tag --title "ragged-pool $tag" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
          gh release upload $tag @($files.FullName) --repo $env:GH_REPO
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed. The release remains a draft.' }
          # Tag lookup exposes published releases, so inspect this draft by its ID.
          $releaseIds = @(gh api --paginate "repos/$($env:GH_REPO)/releases" --jq ".[] | select(.tag_name == `"$tag`") | .id")
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the uploaded draft release ID' }
          if ($releaseIds.Count -ne 1 -or $releaseIds[0] -notmatch '^[0-9]+$') { throw 'Expected one numeric release ID for the exact tag' }
          $releaseId = $releaseIds[0]
          $draftJson = gh api "repos/$($env:GH_REPO)/releases/$releaseId"
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the uploaded draft' }
          $draft = $draftJson | ConvertFrom-Json
          if (-not $draft.draft -or $draft.tag_name -ne $tag) { throw 'Unexpected release state before publication' }
          if (Compare-Object $expectedNames @($draft.assets.name)) { throw 'Draft assets differ from the expected wheel and source archive' }
          foreach ($file in $files) {
            $asset = @($draft.assets | Where-Object { $_.name -eq $file.Name })
            if ($asset.Count -ne 1 -or $asset[0].state -ne 'uploaded' -or $asset[0].size -ne $file.Length) {
              throw "Uploaded asset is incomplete: $($file.Name). The release remains a draft."
            }
          }
          gh release edit $tag --repo $env:GH_REPO --verify-tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Draft publication failed' }
          $publishedJson = gh release view $tag --repo $env:GH_REPO --json url,isDraft,tagName
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify published release state' }
          $published = $publishedJson | ConvertFrom-Json
          if ($published.isDraft -or $published.tagName -ne $tag) { throw 'Release publication was not verified' }
          Write-Output $published.url
