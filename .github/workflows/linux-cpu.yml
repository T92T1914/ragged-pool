name: Linux CPU source distribution

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-sdist-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MAX_JOBS: '2'
      PYTHONNOUSERSITE: '1'
      PYTHONPATH: ''
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      CC: gcc-13
      CXX: g++-13

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select CPython 3.11.8 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.8'
          architecture: x64

      - name: Resolve the ordinary Ubuntu and GCC target
        run: |
          set -euo pipefail
          # Do not turn an instrumented environment into ordinary acceptance.
          for variable in RAGGED_POOL_ASAN LD_PRELOAD ASAN_OPTIONS UBSAN_OPTIONS TSAN_OPTIONS LSAN_OPTIONS CFLAGS CPPFLAGS CXXFLAGS LDFLAGS; do
            if [[ -n "${!variable:-}" ]]; then
              echo "Ordinary CPU acceptance requires an unset $variable" >&2
              exit 1
            fi
          done
          # setup-python supplies the selected interpreter's shared runtime.
          expected_python_lib="${pythonLocation:?setup-python must expose pythonLocation}/lib"
          if [[ "${LD_LIBRARY_PATH:-}" != "$expected_python_lib" ]]; then
            echo 'LD_LIBRARY_PATH must contain only the selected Python runtime directory' >&2
            exit 1
          fi
          test -d "$expected_python_lib"
          test "$(uname -m)" = x86_64
          test "$(lsb_release -rs)" = 24.04
          test "$("$CC" -dumpversion)" = 13
          test "$("$CXX" -dumpversion)" = 13
          python -I -c 'import sys; assert sys.version_info[:3] == (3, 11, 8)'
          mkdir "$RUNNER_TEMP/ragged-linux-evidence" "$RUNNER_TEMP/ragged-linux-dist" "$RUNNER_TEMP/ragged-linux-build"
          {
            cat /etc/os-release
            uname -a
            "$CC" --version
            "$CXX" --version
            "$CXX" -dumpfullversion
            "$CXX" -dumpmachine
            ldd --version
            readelf --version
            python --version
          } | tee "$RUNNER_TEMP/ragged-linux-evidence/toolchain.txt"
          echo "RAGGED_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "RAGGED_DIST=$RUNNER_TEMP/ragged-linux-dist" >> "$GITHUB_ENV"
          echo "RAGGED_EVIDENCE=$RUNNER_TEMP/ragged-linux-evidence" >> "$GITHUB_ENV"

      - name: Create the isolated build environment
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/ragged-linux-build-env"
          python="$RUNNER_TEMP/ragged-linux-build-env/bin/python"
          "$python" -m pip --isolated install 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          "$python" -m pip --isolated install -r requirements-lock.txt
          "$python" -m pip check
          "$python" -m pip freeze --all > "$RAGGED_EVIDENCE/build-environment.txt"

      - name: Build and validate the complete source distribution
        run: |
          set -euo pipefail
          python="$RUNNER_TEMP/ragged-linux-build-env/bin/python"
          # Run the pinned PEP 517 backend hook in its own process.
          "$python" -I -c 'from setuptools.build_meta import build_sdist; import os; build_sdist(os.environ["RAGGED_DIST"])' 2>&1 | tee "$RAGGED_EVIDENCE/sdist-build.log"
          sdists=("$RAGGED_DIST"/*.tar.gz)
          if (( ${#sdists[@]} != 1 )) || ! test -f "${sdists[0]}" || [[ "$(basename "${sdists[0]}")" != ragged_pool-0.1.0.tar.gz ]]; then
            echo 'Expected exactly the declared source distribution' >&2
            exit 1
          fi
          "$python" -I scripts/check_sdist.py --checkout "$GITHUB_WORKSPACE" --sdist "${sdists[0]}" --output "$RAGGED_EVIDENCE/sdist.json" --extract "$RUNNER_TEMP/ragged-sdist-source"
          cat "$RAGGED_EVIDENCE/sdist.json"
          echo "RAGGED_SDIST=${sdists[0]}" >> "$GITHUB_ENV"

      - name: Build the optimized wheel from the validated source archive
        working-directory: ${{ runner.temp }}/ragged-linux-build
        run: |
          set -euo pipefail
          python="$RUNNER_TEMP/ragged-linux-build-env/bin/python"
          "$python" -m pip --isolated wheel "$RAGGED_SDIST" --no-cache-dir --no-build-isolation --no-deps --wheel-dir "$RAGGED_DIST" --verbose 2>&1 | tee "$RAGGED_EVIDENCE/wheel-build.log"
          grep -F -- '-O2 -std=c++17' "$RAGGED_EVIDENCE/wheel-build.log"
          if grep -F -- '-fsanitize' "$RAGGED_EVIDENCE/wheel-build.log"; then
            echo 'An ordinary build must not use sanitizer instrumentation' >&2
            exit 1
          fi
          wheels=("$RAGGED_DIST"/*.whl)
          if (( ${#wheels[@]} != 1 )) || ! test -f "${wheels[0]}" || [[ "$(basename "${wheels[0]}")" != ragged_pool-0.1.0-cp311-cp311-linux_x86_64.whl ]]; then
            echo 'Expected exactly one CPython 3.11 Linux x86_64 wheel' >&2
            exit 1
          fi
          sha256sum "$RAGGED_SDIST" "${wheels[0]}" | tee "$RAGGED_EVIDENCE/distribution-sha256.txt"
          echo "RAGGED_WHEEL=${wheels[0]}" >> "$GITHUB_ENV"

      - name: Prepare a fresh installed consumer from the source distribution
        working-directory: ${{ runner.temp }}/ragged-linux-build
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/ragged-sdist-source"
          consumer="$RUNNER_TEMP/ragged-linux-consumer"
          python -m venv "$RUNNER_TEMP/ragged-linux-accept-env"
          python="$RUNNER_TEMP/ragged-linux-accept-env/bin/python"
          "$python" -m pip --isolated install 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          "$python" -m pip --isolated install -r "$source/requirements-lock.txt"
          "$python" -m pip --isolated install "$RAGGED_WHEEL"
          "$python" -m pip check | tee "$RAGGED_EVIDENCE/pip-check.txt"
          "$python" -m pip freeze --all > "$RAGGED_EVIDENCE/acceptance-environment.txt"
          mkdir "$consumer" "$consumer/scripts"
          cp -r "$source/tests" "$source/examples" "$consumer/"
          cp "$source/scripts/check_installed.py" "$source/scripts/check_sdist.py" "$source/scripts/check_stochastic_receipt.py" "$source/scripts/check_activation_receipt.py" "$consumer/scripts/"
          # Read-only source fixtures serve mocked build/loader tests only.
          # Numerical tests continue importing the ordinary installed package.
          mkdir -p "$consumer/src/ragged_pool"
          cp "$source/setup.py" "$consumer/"
          cp "$source/src/ragged_pool/_build.py" "$source/src/ragged_pool/__init__.py" "$consumer/src/ragged_pool/"
          chmod a-w "$consumer/setup.py" "$consumer/src/ragged_pool/_build.py" "$consumer/src/ragged_pool/__init__.py"

      - name: Verify installed bytes, licenses and ordinary native dependencies
        working-directory: ${{ runner.temp }}/ragged-linux-consumer
        run: |
          set -euo pipefail
          python="$RUNNER_TEMP/ragged-linux-accept-env/bin/python"
          "$python" -I scripts/check_installed.py --checkout "$RUNNER_TEMP/ragged-sdist-source" --wheel "$RAGGED_WHEEL" | tee "$RAGGED_EVIDENCE/installed.json"
          native="$("$python" -I -c 'from importlib.metadata import distribution; import json, os; from pathlib import Path; record = json.loads((Path(os.environ["RAGGED_EVIDENCE"]) / "installed.json").read_text()); print(Path(distribution("ragged-pool").locate_file(record["native_library"])).resolve(strict=True))')"
          torch_lib="$("$python" -I -c 'from pathlib import Path; import torch; print(Path(torch.__file__).resolve().parent / "lib")')"
          readelf -d "$native" > "$RAGGED_EVIDENCE/native-dynamic.txt"
          readelf -Ws "$native" > "$RAGGED_EVIDENCE/native-symbols.txt"
          LD_LIBRARY_PATH="$torch_lib:$LD_LIBRARY_PATH" ldd "$native" | tee "$RAGGED_EVIDENCE/native-ldd.txt"
          if grep -Ei 'lib(asan|ubsan|tsan|lsan)|not found' "$RAGGED_EVIDENCE/native-ldd.txt" "$RAGGED_EVIDENCE/native-dynamic.txt"; then
            echo 'The ordinary extension has an instrumented or unresolved dependency' >&2
            exit 1
          fi
          if grep -E '__asan_|__ubsan_|__tsan_|__lsan_' "$RAGGED_EVIDENCE/native-symbols.txt"; then
            echo 'The ordinary extension contains sanitizer symbols' >&2
            exit 1
          fi
          "$python" -I - <<'PY' | tee "$RAGGED_EVIDENCE/runtime.json"
          import hashlib
          from importlib.metadata import distribution
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          import sys
          import sysconfig
          import torch

          torch.set_num_threads(1)
          torch.set_num_interop_threads(1)
          evidence = Path(os.environ["RAGGED_EVIDENCE"])
          dependencies = {}
          for line in (evidence / "native-ldd.txt").read_text().splitlines():
              fields = line.split()
              if len(fields) >= 3 and fields[1] == "=>":
                  dependencies[fields[0]] = str(Path(fields[2]).resolve(strict=True))
          runtimes = {}
          for name in ("libc.so.6", "libstdc++.so.6", "libgcc_s.so.1"):
              path = Path(dependencies[name])
              runtimes[name] = {"path": str(path), "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
          compiler_stdlib = Path(subprocess.check_output(
              [os.environ["CXX"], "-print-file-name=libstdc++.so.6"], text=True).strip()).resolve(strict=True)
          assert str(compiler_stdlib) == runtimes["libstdc++.so.6"]["path"]
          wheel = Path(os.environ["RAGGED_WHEEL"])
          installed = json.loads((evidence / "installed.json").read_text())
          native = Path(distribution("ragged-pool").locate_file(installed["native_library"])).resolve(strict=True)
          assert torch.version.cuda is None
          record = {
              "source_revision": os.environ["RAGGED_REVISION"],
              "platform": platform.platform(), "architecture": platform.machine(),
              "python_version": platform.python_version(), "torch_version": torch.__version__,
              "extension_suffix": sysconfig.get_config_var("EXT_SUFFIX"),
              "torch_cxx11_abi": torch.compiled_with_cxx11_abi(),
              "compiler": os.environ["CXX"],
              "compiler_version": subprocess.check_output([os.environ["CXX"], "-dumpfullversion"], text=True).strip(),
              "cxx_standard": "C++17", "extension_compile_flags": ["-O2", "-std=c++17"],
              "build_command_log": "wheel-build.log", "instrumentation": "none detected",
              "preload": None, "library_search_path": os.environ["LD_LIBRARY_PATH"],
              "libc": list(platform.libc_ver()), "runtimes": runtimes,
              "wheel_name": wheel.name, "wheel_sha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
              "native_name": native.name, "native_sha256": hashlib.sha256(native.read_bytes()).hexdigest(),
              "torch_intraop_threads": torch.get_num_threads(), "torch_interop_threads": torch.get_num_interop_threads(),
              "max_build_jobs": int(os.environ["MAX_JOBS"]),
              "compatibility_scope": "This Ubuntu 24.04 x86_64 job and pinned Python/PyTorch toolchain only. No manylinux or cross-platform ABI claim."
          }
          print(json.dumps(record, indent=2))
          PY

      - name: Check installed contracts, gradients, registration and training
        working-directory: ${{ runner.temp }}/ragged-linux-consumer
        run: |
          set -euo pipefail
          python="$RUNNER_TEMP/ragged-linux-accept-env/bin/python"
          "$python" -I -m pytest -q --import-mode=importlib --junitxml "$RAGGED_EVIDENCE/pytest.xml" tests 2>&1 | tee "$RAGGED_EVIDENCE/pytest.log"
          "$python" -I examples/train_sets.py --dtype float32 2>&1 | tee "$RAGGED_EVIDENCE/training-float32.log"
          "$python" -I examples/train_sets.py --dtype float64 2>&1 | tee "$RAGGED_EVIDENCE/training-float64.log"
          "$python" -I examples/train_padded.py --dtype float32 --output "$RAGGED_EVIDENCE/padded-float32.json" 2>&1 | tee "$RAGGED_EVIDENCE/padded-float32.log"
          "$python" -I examples/train_padded.py --dtype float64 --output "$RAGGED_EVIDENCE/padded-float64.json" 2>&1 | tee "$RAGGED_EVIDENCE/padded-float64.log"
          "$python" -I examples/train_padded.py --compiled --dtype float32 --output "$RAGGED_EVIDENCE/padded-compiled-float32.json" 2>&1 | tee "$RAGGED_EVIDENCE/padded-compiled-float32.log"
          "$python" -I examples/train_padded.py --compiled --dtype float64 --output "$RAGGED_EVIDENCE/padded-compiled-float64.json" 2>&1 | tee "$RAGGED_EVIDENCE/padded-compiled-float64.log"
          "$python" -I examples/train_gradient_penalty.py --dtype float32 --output "$RAGGED_EVIDENCE/gradient-penalty-float32.json" 2>&1 | tee "$RAGGED_EVIDENCE/gradient-penalty-float32.log"
          "$python" -I examples/train_gradient_penalty.py --dtype float64 --output "$RAGGED_EVIDENCE/gradient-penalty-float64.json" 2>&1 | tee "$RAGGED_EVIDENCE/gradient-penalty-float64.log"
          for dtype in float32 float64; do
            receipt="$RAGGED_EVIDENCE/padded-gradient-penalty-$dtype.json"
            "$python" -I examples/train_padded_gradient_penalty.py --dtype "$dtype" --output "$receipt" 2>&1 | tee "$RAGGED_EVIDENCE/padded-gradient-penalty-$dtype.log"
            "$python" -I - "$receipt" "$dtype" <<'PY'
          import json
          from pathlib import Path
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["status"] == "passed" and receipt["dtype"] == sys.argv[2]
          assert receipt["optimizer_steps"] == receipt["reference_optimizer_steps"] == 2
          assert receipt["normalization"] == "selected_raw_features"
          assert receipt["invariance"]["status"] == receipt["controls"]["status"] == receipt["all_empty"]["status"] == "passed"
          print("Padded gradient penalty", sys.argv[2], "passed two updates, invariance and controls")
          PY
            cat "$receipt"
          done
          for dtype in float32 float64; do
            receipt="$RAGGED_EVIDENCE/clipped-$dtype.json"
            "$python" -I examples/train_clipped.py --dtype "$dtype" --aggregation forward-microbatches --chunk-size 2 --output "$receipt" 2>&1 | tee "$RAGGED_EVIDENCE/clipped-$dtype.log"
            "$python" -I - "$receipt" "$dtype" <<'PY'
          import json
          from pathlib import Path
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["status"] == "passed" and receipt["dtype"] == sys.argv[2]
          assert receipt["method"] == "autograd.grad.is_grads_batched"
          assert receipt["aggregation_method"] == "microbatched_per_example_joint_clip" and receipt["chunk_size_requested"] == 2
          for step in receipt["steps"]:
              chunk = step["chunking"]
              assert chunk["effective_size"] == chunk["max_rows"] == 2
              assert chunk["chunk_rows"] == chunk["forward_rows"] == [2, 2, 1]
              assert chunk["retain_graph"] == [False, False, False] and chunk["global_denominator"] == 5
              assert chunk["seed_shapes"] == [[2, 2], [2, 2], [1, 1]]
          assert receipt["optimizer_steps"] == receipt["reference_optimizer_steps"] == 2
          assert receipt["controls"]["status"] == receipt["invariance"]["status"] == receipt["empty"]["status"] == "passed"
          print("Per-example clipped gradients", sys.argv[2], "passed two updates, invariance and controls")
          PY
            cat "$receipt"
          done
          for dtype in float32 float64; do
            receipt="$RAGGED_EVIDENCE/forward-ad-$dtype.json"
            "$python" -I examples/train_forward_ad.py --dtype "$dtype" --output "$receipt"
            "$python" -I - "$receipt" "$dtype" <<'PY'
          import json
          from pathlib import Path
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["status"] == "passed" and receipt["dtype"] == sys.argv[2]
          assert receipt["optimizer_steps"] == receipt["reference_optimizer_steps"] == receipt["original_native_optimizer_steps"] == 2
          assert receipt["sensitivity"]["status"] == "passed" and receipt["sensitivity"]["parameters_fixed"]
          assert receipt["inputs_unchanged"] and receipt["installed_package"] and receipt["native_library_loaded"]
          assert receipt["threads"] == receipt["interop_threads"] == 1
          print("Packed forward AD", sys.argv[2], "passed two updates and fixed-parameter sensitivity")
          PY
            cat "$receipt"
          done
          for dtype in float32 float64; do
            receipt="$RAGGED_EVIDENCE/functional-models-$dtype.json"
            "$python" -I examples/train_functional_models.py --dtype "$dtype" --output "$receipt"
            "$python" -I - "$receipt" "$dtype" <<'PY'
          import json
          from pathlib import Path
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["status"] == "passed" and receipt["dtype"] == sys.argv[2]
          assert receipt["method"] == "torch.func.vmap.grad.functional_call" and receipt["models"] == 3
          assert receipt["optimizer_steps"] == receipt["original_native_optimizer_steps"] == receipt["reference_optimizer_steps"] == 2
          assert receipt["shared_input_gradients"]["status"] == "passed" and receipt["shared_input_gradients"]["sum_differs_from_mean"]
          assert receipt["parameters_stacked_leaf"] and receipt["inputs_unchanged"] and receipt["installed_package"] and receipt["native_library_loaded"]
          assert receipt["threads"] == receipt["interop_threads"] == 1
          print("Functional models", sys.argv[2], "passed two updates and shared-input gradient controls")
          PY
            cat "$receipt"
          done
          for dtype in float32 float64; do
            receipt="$RAGGED_EVIDENCE/curvature-$dtype.json"
            "$python" -I examples/train_curvature.py --dtype "$dtype" --output "$receipt"
            "$python" -I - "$receipt" "$dtype" <<'PY'
          import json
          from pathlib import Path
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["status"] == "passed" and receipt["dtype"] == sys.argv[2]
          assert receipt["method"] == "torch.func.jvp.grad.functional_call"
          assert receipt["optimizer_steps"] == receipt["original_native_optimizer_steps"] == receipt["reference_optimizer_steps"] == 2
          assert receipt["parameter_tensors"] == 5 and receipt["scalar_parameters"] == 25
          result = receipt["curvature"]
          assert result["status"] == "passed" and result["parameters_fixed"] and result["optimizer_steps"] == 0 and result["directions"] == 2
          assert not result["full_hessian_materialized"] and result["inputs_and_parameters_unchanged"] and result["parameter_grad_fields_unset"]
          assert all(result[key]["status"] == "passed" for key in ("bilinear_symmetry", "linearity", "zero_direction"))
          assert receipt["inputs_unchanged"] and receipt["gradients_and_hvps_finite"] and receipt["installed_package"] and receipt["native_library_loaded"]
          assert receipt["threads"] == receipt["interop_threads"] == 1
          print("Curvature", sys.argv[2], "passed two updates and fixed-parameter HVP controls")
          PY
            cat "$receipt"
          done
          for dtype in float32 float64; do
            receipt="$RAGGED_EVIDENCE/solve-$dtype.json"
            "$python" -I examples/solve_curvature.py --dtype "$dtype" --output "$receipt"
            "$python" -I - "$receipt" "$dtype" <<'PY'
          import json
          from pathlib import Path
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["status"] == "passed" and receipt["dtype"] == sys.argv[2]
          assert receipt["method"] == "damped_cg.packed_parameter_hvp"
          assert receipt["optimizer_steps"] == receipt["original_native_optimizer_steps"] == receipt["reference_optimizer_steps"] == 2
          result = receipt["solve"]
          assert result["status"] == "converged" and result["parameters_fixed"] and result["optimizer_steps"] == 0
          assert not result["full_hessian_materialized"] and not result["model_updated_with_solution"]
          assert result["inputs_and_parameters_unchanged"] and result["parameter_grad_fields_unset"]
          assert all(result["solve_reports"][route]["status"] == "converged" for route in ("bridge", "original_native_reverse_over_reverse", "reference_hvp"))
          assert all(row["accepted"] and row["norm"] <= row["threshold"] for row in result["independent_residuals"].values())
          assert all(row["products"] <= 33 for row in result["solve_reports"].values())
          assert result["omitted_h_control"]["status"] == "rejected_by_residual" and result["omitted_h_control"]["exceeds_threshold"]
          assert receipt["inputs_unchanged"] and receipt["installed_package"] and receipt["native_library_loaded"]
          assert receipt["threads"] == receipt["interop_threads"] == 1
          print("Damped solve", sys.argv[2], "passed fixed-parameter residual acceptance without another update")
          PY
            cat "$receipt"
          done
          for dtype in float32 float64; do
            receipt="$RAGGED_EVIDENCE/dynamic-$dtype.json"
            "$python" -I examples/train_dynamic.py --dtype "$dtype" --output "$receipt"
            "$python" -I - "$receipt" "$dtype" <<'PY'
          import json
          from pathlib import Path
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["status"] == "passed" and receipt["dtype"] == sys.argv[2]
          assert receipt["method"] == "torch.compile.aot_eager.dynamic.packed_training"
          assert receipt["optimizer_steps"] == receipt["compiled_optimizer_steps"] == receipt["native_optimizer_steps"] == receipt["original_native_optimizer_steps"] == receipt["reference_optimizer_steps"] == 5
          assert len(receipt["steps"]) == 5
          route = receipt["compile"]
          assert route["backend"] == "aot_eager" and route["fullgraph"] and route["dynamic"] and route["compile_calls"] == 1
          assert not route["graph_count_observed"] and not route["optimizer_inside_compiled_region"]
          assert receipt["same_model_parameter_and_optimizer_objects"] and receipt["changed_partition_at_same_metadata"] and receipt["returned_shape_with_changed_partition"]
          assert receipt["inputs_unchanged"] and receipt["initial_parameters_unchanged"] and receipt["gradients_finite"]
          assert receipt["installed_package"] and receipt["native_library_loaded"] and receipt["threads"] == receipt["interop_threads"] == 1
          for step in receipt["steps"]:
              assert step["all_routes_all_parameter_blocks_changed"] and step["empty_group_pooled_zero"]
              assert step["same_parameter_objects"] and step["same_optimizer_objects"] and step["inputs_unchanged"]
          print("Dynamic training", sys.argv[2], "passed five changing-shape updates through the public backend string")
          PY
            cat "$receipt"
          done
          for dtype in float32 float64; do
            receipt="$RAGGED_EVIDENCE/resume-$dtype.json"
            "$python" -I examples/resume_training.py --dtype "$dtype" --directory "$RAGGED_EVIDENCE/resume-$dtype" --output "$receipt" > "$RAGGED_EVIDENCE/resume-$dtype.stdout.log" 2>&1
            "$python" -I - "$receipt" "$dtype" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text())
          assert receipt["status"] == "passed" and receipt["dtype"] == sys.argv[2]
          assert receipt["method"] == "state_dict.packed_training_resume" and receipt["device"] == "cpu"
          assert receipt["optimizer_steps"] == 5 and receipt["producer_steps"] == 2 and receipt["resumed_steps"] == 3 and receipt["checkpoint_cursor"] == 2
          assert receipt["optimizer"] == "SGD" and receipt["learning_rate"] == 0.03 and receipt["momentum"] == 0.8
          assert receipt["same_native_exact"] and receipt["primitive_comparisons_passed"] and receipt["independent_momentum_recurrence"]
          assert receipt["model_only_reset_optimizer_diverged"] and receipt["no_live_rng_continuation"]
          assert receipt["input_sources_unchanged"] and receipt["loaded_state_storage_independent"] and len(receipt["steps"]) == 5
          assert receipt["checkpoint_bytes"] <= receipt["checkpoint_byte_limit"]
          process_ids = [receipt["process_ids"][name] for name in ("parent", "producer", "resumer")]
          assert receipt["distinct_processes"] and len(set(process_ids)) == 3 and all(type(value) is int and value > 0 for value in process_ids)
          assert receipt["checkpoint_unchanged"] and receipt["checkpoint_bytes"] > 0 and re.fullmatch(r"[0-9a-f]{64}", receipt["checkpoint_sha256"])
          assert receipt["installed_package"] and receipt["native_library_loaded"] and receipt["threads"] == receipt["interop_threads"] == 1
          print("Training resume", sys.argv[2], "passed two producer updates and three fresh-process continuation updates")
          PY
            cat "$receipt"
          done
          for dtype in float32 float64; do
            receipt="$RAGGED_EVIDENCE/checkpointed-$dtype.json"
            "$python" -I examples/train_checkpointed.py --dtype "$dtype" --output "$receipt"
            "$python" -I "$GITHUB_WORKSPACE/scripts/check_activation_receipt.py" "$receipt" "$dtype"
            cat "$receipt"
          done
          for dtype in float32 float64; do
            receipt="$RAGGED_EVIDENCE/stochastic-$dtype.json"
            "$python" -I examples/resume_stochastic.py --dtype "$dtype" --directory "$RAGGED_EVIDENCE/stochastic-$dtype" --output "$receipt" > "$RAGGED_EVIDENCE/stochastic-$dtype.stdout.log" 2>&1
            "$python" -I "$GITHUB_WORKSPACE/scripts/check_stochastic_receipt.py" "$receipt" "$dtype"
            cat "$receipt"
          done
          mkdir "$RAGGED_EVIDENCE/padded-export"
          for dtype in float32 float64; do
            bundle="$RAGGED_EVIDENCE/padded-export/$dtype"
            producer="$RAGGED_EVIDENCE/padded-export/producer-$dtype.json"
            consumer="$RAGGED_EVIDENCE/padded-export/consumer-$dtype.json"
            "$python" -I examples/export_padded.py --dtype "$dtype" --directory "$bundle" --source-revision "$RAGGED_REVISION" --wheel "$RAGGED_WHEEL" --output "$producer" 2>&1 | tee "$RAGGED_EVIDENCE/padded-export/producer-$dtype.log"
            manifest_sha256="$("$python" -I - "$producer" "$dtype" "$RAGGED_REVISION" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          producer = json.loads(Path(sys.argv[1]).read_text())
          assert producer["status"] == "passed" and producer["dtype"] == sys.argv[2]
          assert producer["source_revision"] == sys.argv[3]
          assert producer["training"]["optimizer_steps"] == 2
          assert re.fullmatch(r"[0-9a-f]{64}", producer["manifest_sha256"])
          print(producer["manifest_sha256"])
          PY
            )"
            "$python" -I examples/predict_padded.py --directory "$bundle" --manifest-sha256 "$manifest_sha256" --output "$consumer" 2>&1 | tee "$RAGGED_EVIDENCE/padded-export/consumer-$dtype.log"
            "$python" -I - "$producer" "$consumer" "$bundle/manifest.json" "$dtype" "$RAGGED_REVISION" <<'PY'
          import json
          from pathlib import Path
          import sys

          producer, consumer, manifest = (json.loads(Path(path).read_text()) for path in sys.argv[1:4])
          assert consumer["status"] == "passed" and consumer["dtype"] == sys.argv[4]
          assert producer["source_revision"] == consumer["source_revision"] == sys.argv[5]
          assert consumer["expected_manifest_sha256"] == producer["manifest_sha256"]
          assert len(manifest["cases"]) > 0 and len(consumer["cases"]) == len(manifest["cases"])
          assert consumer["training_modules_loaded"] == []
          print("Padded export", sys.argv[4], "passed two training updates and", len(consumer["cases"]), "fresh-process cases")
          PY
            cat "$producer" "$consumer"
          done
          "$python" -I examples/learn_sets.py --smoke --source-revision "$RAGGED_REVISION" --wheel "$RAGGED_WHEEL" --output "$RAGGED_EVIDENCE/study-smoke.json" 2>&1 | tee "$RAGGED_EVIDENCE/study-smoke.log"

      - name: Train the installed two-rank CPU consumer
        working-directory: ${{ runner.temp }}/ragged-linux-consumer
        run: |
          set -euo pipefail
          python="$RUNNER_TEMP/ragged-linux-accept-env/bin/python"
          tree="$(git -C "$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}')"
          for dtype in float32 float64; do
            "$python" -I -B examples/train_distributed.py --dtype "$dtype" --directory "$RAGGED_EVIDENCE/distributed-$dtype" --output "$RAGGED_EVIDENCE/distributed-$dtype.json" --wheel "$RAGGED_WHEEL" --source-revision "$RAGGED_REVISION" --source-tree "$tree"
          done
          if "$python" -I -B examples/train_distributed.py --dtype float32 --directory "$RAGGED_EVIDENCE/distributed-failure" --output "$RAGGED_EVIDENCE/distributed-failure.json" --wheel "$RAGGED_WHEEL" --fail-rank 1; then
            echo 'Injected worker failure unexpectedly succeeded'
            exit 1
          else
            test "$?" -eq 1
          fi
          "$python" -I - "$RAGGED_EVIDENCE" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          failed = json.loads((root / 'distributed-failure.json').read_text())
          rank = json.loads((root / 'distributed-failure/worker-1.json').read_text())
          assert failed['status'] == 'failed' and failed['deliberate_failure_rank'] == 1
          assert 'oracles' not in failed
          assert failed['lifecycle']['all_owned_workers_reaped']
          owned = failed['lifecycle']['owned_processes']
          assert len(owned) == 2 and all(not p['alive'] and p['exitcode'] not in (None, 0) for p in owned)
          assert rank['status'] == 'error' and rank['error_type'] == 'RuntimeError'
          assert rank['error'] == 'Deliberate owned-worker failure before Gloo initialization'
          for dtype in ('float32', 'float64'):
              result = json.loads((root / f'distributed-{dtype}.json').read_text())
              assert result['status'] == 'passed' and result['global_group_counts'] == [5, 4]
              print('Distributed result', json.dumps({'dtype': dtype, 'comparison': result['comparison'],
                  'identity': result['identity'], 'source_labels': result['source_labels'],
                  'local_group_counts': result['local_group_counts'],
                  'transport_scope': result['transport_scope'],
                  'all_owned_workers_reaped': result['lifecycle']['all_owned_workers_reaped']}, sort_keys=True))
          print('Distributed injected failure control passed: both directly owned workers reaped')
          PY

      - name: Accumulate installed CPU microbatches before the distributed update
        working-directory: ${{ runner.temp }}/ragged-linux-consumer
        run: |
          set -euo pipefail
          python="$RUNNER_TEMP/ragged-linux-accept-env/bin/python"
          tree="$(git -C "$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}')"
          for dtype in float32 float64; do
            "$python" -I -B examples/train_distributed.py --accumulate --dtype "$dtype" --directory "$RAGGED_EVIDENCE/accumulated-$dtype" --output "$RAGGED_EVIDENCE/accumulated-$dtype.json" --wheel "$RAGGED_WHEEL" --source-revision "$RAGGED_REVISION" --source-tree "$tree"
          done
          if "$python" -I -B examples/train_distributed.py --accumulate --dtype float32 --directory "$RAGGED_EVIDENCE/accumulated-failure" --output "$RAGGED_EVIDENCE/accumulated-failure.json" --wheel "$RAGGED_WHEEL" --fail-rank 1; then
            echo 'Accumulation failure control unexpectedly succeeded'
            exit 1
          else
            test "$?" -eq 1
          fi
          "$python" -I - "$RAGGED_EVIDENCE" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          failed = json.loads((root / 'accumulated-failure.json').read_text())
          rank = json.loads((root / 'accumulated-failure/worker-1.json').read_text())
          assert failed['status'] == 'failed' and failed['accumulation'] is True
          assert failed['deliberate_failure_rank'] == 1 and 'oracles' not in failed
          assert failed['lifecycle']['all_owned_workers_reaped']
          owned = failed['lifecycle']['owned_processes']
          assert len(owned) == 2 and all(not p['alive'] and p['exitcode'] not in (None, 0) for p in owned)
          assert rank['status'] == 'error' and rank['error_type'] == 'RuntimeError'
          assert rank['error'] == 'Deliberate owned-worker failure before Gloo initialization'
          for dtype in ('float32', 'float64'):
              result = json.loads((root / f'accumulated-{dtype}.json').read_text())
              assert result['status'] == 'passed' and result['accumulation'] is True
              assert result['global_group_counts'] == [9, 5]
              assert result['windows'] == result['microbatches_per_window'] == 2
              workers = result['workers']
              for worker in workers:
                  for mode, steps in worker['routes'].items():
                      expected = [1, 1] if mode == 'eager_sync' else [0, 1]
                      assert len(steps) == 2
                      for step in steps:
                          assert [m['hook_calls'] for m in step['microbatches']] == expected
                          assert step['optimizer_steps'] == step['zero_grad_calls'] == 1
              print('Accumulated distributed result', json.dumps({'dtype': dtype,
                  'comparison': result['comparison'], 'identity': result['identity'],
                  'source_labels': result['source_labels'],
                  'global_group_counts': result['global_group_counts'],
                  'global_micro_group_counts': result['global_micro_group_counts'],
                  'local_micro_group_counts': result['local_micro_group_counts'],
                  'communication_hooks': [w['communication_hooks'] for w in workers],
                  'communication_scope': result['communication_scope'],
                  'all_owned_workers_reaped': result['lifecycle']['all_owned_workers_reaped']}, sort_keys=True))
          print('Accumulated injected failure control passed: both directly owned workers reaped')
          PY

      - name: Continue a completed distributed window in fresh installed workers
        working-directory: ${{ runner.temp }}/ragged-linux-consumer
        run: |
          set -euo pipefail
          python="$RUNNER_TEMP/ragged-linux-accept-env/bin/python"
          tree="$(git -C "$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}')"
          for dtype in float32 float64; do
            "$python" -I -B examples/resume_distributed.py --dtype "$dtype" --directory "$RAGGED_EVIDENCE/resumed-$dtype" --output "$RAGGED_EVIDENCE/resumed-$dtype.json" --wheel "$RAGGED_WHEEL" --source-revision "$RAGGED_REVISION" --source-tree "$tree"
          done
          if "$python" -I -B examples/resume_distributed.py --dtype float32 --directory "$RAGGED_EVIDENCE/resumed-rejected" --output "$RAGGED_EVIDENCE/resumed-rejected.json" --wheel "$RAGGED_WHEEL" --reject-resume-rank1; then
            echo 'Bad rank 1 restored state unexpectedly released the continuation gate'
            exit 1
          else
            test "$?" -eq 1
          fi
          "$python" -I - "$RAGGED_EVIDENCE" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          failed = json.loads((root / 'resumed-rejected.json').read_text())
          assert failed['status'] == 'failed'
          assert failed['deliberate_rejection_rank'] == 1
          assert failed['admission_control'] == {
              'parent_rejected_actual_rank1_momentum': True,
              'rank0_canonical_state_accepted': True,
              'both_owned_ready_receipts_observed': True,
              'changed_tensor_name': 'encoder.weight',
              'no_process_group_or_ddp_attempted': True}
          assert 'oracles' not in failed and 'comparison' not in failed
          rejected = failed['cohorts']['resumed']
          assert rejected['admission']['released'] is False
          assert rejected['admission']['reason'] == 'ReadinessMismatch: Parent rejected rank 1 pre-process-group correct momentum: encoder.weight'
          assert len(rejected['admission']['ready_receipts']) == 2
          assert rejected['admission']['state_checks'] == [
              {'rank': 0, 'status': 'accepted', 'canonical_state_exact': True},
              {'rank': 1, 'status': 'rejected', 'mode': 'correct', 'field': 'momentum',
               'changed_tensor_names': ['encoder.weight']}]
          assert rejected['process_group_initialization_attempted'] == [False, False]
          assert rejected['ddp_construction_attempted'] == [False, False]
          assert rejected['lifecycle']['all_owned_workers_reaped']
          assert len(rejected['lifecycle']['owned_processes']) == 2
          assert all(not p['alive'] and p['exitcode'] not in (None, 0)
                     for p in rejected['lifecycle']['owned_processes'])
          for dtype in ('float32', 'float64'):
              result = json.loads((root / f'resumed-{dtype}.json').read_text())
              assert result['status'] == 'passed' and result['dtype'] == dtype
              assert set(result['cohorts']) == {'continuous', 'producer', 'resumed'}
              for cohort in result['cohorts'].values():
                  assert cohort['admission']['released'] is True
                  assert cohort['admission']['pre_process_group_states_verified'] is True
                  assert cohort['process_group_initialization_attempted'] == [True, True]
                  assert cohort['ddp_construction_attempted'] == [True, True]
                  assert cohort['lifecycle']['all_owned_workers_reaped']
                  assert len(cohort['lifecycle']['owned_processes']) == 2
                  assert all(not p['alive'] and p['exitcode'] == 0
                             for p in cohort['lifecycle']['owned_processes'])
              print('Resumed distributed result', json.dumps({
                  'dtype': dtype, 'checkpoint_sha256': result['checkpoint_sha256'],
                  'metadata': result['metadata'], 'identity': result['identity'],
                  'source_labels': result['source_labels'], 'comparison': result['comparison'],
                  'all_owned_workers_reaped': all(c['lifecycle']['all_owned_workers_reaped']
                                               for c in result['cohorts'].values())}, sort_keys=True))
          print('Distributed resume admission control passed: no process group or DDP construction; both owned workers reaped')
          PY

      - name: Clip the synchronized installed CPU model gradient
        working-directory: ${{ runner.temp }}/ragged-linux-consumer
        run: |
          set -euo pipefail
          python="$RUNNER_TEMP/ragged-linux-accept-env/bin/python"
          tree="$(git -C "$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}')"
          for dtype in float32 float64; do
            "$python" -I -B examples/clip_distributed.py --dtype "$dtype" --directory "$RAGGED_EVIDENCE/global-clipped-$dtype" --output "$RAGGED_EVIDENCE/global-clipped-$dtype.json" --wheel "$RAGGED_WHEEL" --source-revision "$RAGGED_REVISION" --source-tree "$tree"
          done
          if "$python" -I -B examples/clip_distributed.py --dtype float32 --directory "$RAGGED_EVIDENCE/global-clipped-failure" --output "$RAGGED_EVIDENCE/global-clipped-failure.json" --wheel "$RAGGED_WHEEL" --fail-rank 1; then
            echo 'Injected clipping worker failure unexpectedly succeeded'
            exit 1
          else
            test "$?" -eq 1
          fi
          "$python" -I - "$RAGGED_EVIDENCE" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          failed = json.loads((root / 'global-clipped-failure.json').read_text())
          rank = json.loads((root / 'global-clipped-failure/worker-1.json').read_text())
          assert failed['status'] == 'failed' and failed['deliberate_failure_rank'] == 1
          assert 'oracles' not in failed and 'comparison' not in failed
          assert failed['lifecycle']['all_owned_workers_reaped']
          assert len(failed['lifecycle']['owned_processes']) == 2
          assert all(not p['alive'] and p['exitcode'] not in (None, 0)
                     for p in failed['lifecycle']['owned_processes'])
          assert rank['status'] == 'error' and rank['error_type'] == 'RuntimeError'
          assert rank['error'] == 'Deliberate owned-worker failure before Gloo initialization'
          for dtype in ('float32', 'float64'):
              result = json.loads((root / f'global-clipped-{dtype}.json').read_text())
              assert result['status'] == 'passed' and result['dtype'] == dtype
              assert result['clipping_caps'] == [0.25, 2.0] and result['clipping_epsilon'] == 1e-6
              assert result['global_group_counts'] == [9, 5]
              assert result['lifecycle']['all_owned_workers_reaped']
              assert len(result['lifecycle']['owned_processes']) == 2
              assert all(not p['alive'] and p['exitcode'] == 0 for p in result['lifecycle']['owned_processes'])
              controls = result['comparison']['duplicate_replica_norm_controls']
              assert len(controls) == 2 and all(c['correct_active_windows'] == [True, False] for c in controls)
              assert all(c['replica_control_active_windows'] == [True, False] for c in controls)
              for worker in result['workers']:
                  assert set(worker['routes']) == {'global', 'replica_norm_control'}
                  for mode, windows in worker['routes'].items():
                      assert len(windows) == 2
                      for window in windows:
                          assert [micro['hook_calls'] for micro in window['microbatches']] == [0, 1]
                          assert window['clipping']['norm_scalar_collectives'] == int(mode == 'replica_norm_control')
                          assert set(window['clipping']['pre_clip_gradients']) == set(window['parameter_gradients'])
              print('Clipped distributed result', json.dumps({'dtype': dtype,
                  'identity': result['identity'], 'source_labels': result['source_labels'],
                  'comparison': result['comparison'], 'all_owned_workers_reaped': True}, sort_keys=True))
          print('Clipping injected failure control passed: both directly owned workers reaped')
          PY

      - name: Train and export the selected model, then predict in a fresh process
        working-directory: ${{ runner.temp }}/ragged-linux-consumer
        run: |
          set -euo pipefail
          python="$RUNNER_TEMP/ragged-linux-accept-env/bin/python"
          artifact="$RUNNER_TEMP/ragged-linux-export"
          "$python" -I examples/export_sets.py --directory "$artifact" --source-revision "$RAGGED_REVISION" --wheel "$RAGGED_WHEEL" --output "$RAGGED_EVIDENCE/export-producer.json" 2>&1 | tee "$RAGGED_EVIDENCE/export-producer.log"
          manifest_sha256="$("$python" -I -c 'import json, os; from pathlib import Path; print(json.loads((Path(os.environ["RAGGED_EVIDENCE"]) / "export-producer.json").read_text())["artifact"]["manifest_sha256"])')"
          "$python" -I examples/predict_sets.py --directory "$artifact" --manifest-sha256 "$manifest_sha256" --output "$RAGGED_EVIDENCE/export-consumer.json" 2>&1 | tee "$RAGGED_EVIDENCE/export-consumer.log"
          "$python" -I - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["RAGGED_EVIDENCE"])
          producer = json.loads((evidence / "export-producer.json").read_text())
          consumer = json.loads((evidence / "export-consumer.json").read_text())
          manifest = json.loads((Path(os.environ["RUNNER_TEMP"]) / "ragged-linux-export/manifest.json").read_text())
          assert producer["status"] == "passed" and producer["mode"] == "full"
          assert manifest["training"]["updates"] == 200
          assert consumer["status"] == "passed" and len(consumer["cases"]) == 8
          assert consumer["training_modules_loaded"] == []
          assert producer["source_revision"] == consumer["source_revision"] == os.environ["RAGGED_REVISION"]
          assert consumer["expected_manifest_sha256"] == producer["artifact"]["manifest_sha256"]
          print("Full 200-update producer and eight fresh-process prediction cases passed")
          print("Tested source:", os.environ["RAGGED_REVISION"])
          PY

      - name: Retain the accepted Linux distributions and trained artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-cpu-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ragged-linux-dist/*.tar.gz
            ${{ runner.temp }}/ragged-linux-dist/*.whl
            ${{ runner.temp }}/ragged-linux-export
          if-no-files-found: error
          retention-days: 14

      - name: Retain Linux acceptance receipts and build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-cpu-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/ragged-linux-evidence
          if-no-files-found: warn
          retention-days: 14
