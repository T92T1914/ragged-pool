[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1", "torch==2.9.1+cpu"]
build-backend = "setuptools.build_meta"

[project]
name = "ragged-pool"
version = "0.1.0"
description = "Bounded CPU softmax pooling with native PyTorch autograd"
requires-python = ">=3.11,<3.12"
dynamic = ["dependencies"]
license = "MIT"
license-files = ["LICENSE", "NOTICE", "third_party/PYTORCH-LICENSE"]

[project.urls]
Repository = "https://github.com/T92T1914/ragged-pool"
Issues = "https://github.com/T92T1914/ragged-pool/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
